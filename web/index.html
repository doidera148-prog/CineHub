<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>CineHub</title>
  <!-- Favicon vazio: o app não tem ícone de aba e o navegador não precisa pedir favicon.ico. -->
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="./vendor/video-js.min.css">
  <link rel="stylesheet" href="./style.css">
  <link rel="stylesheet" href="./accessibility.css">
  <link rel="stylesheet" href="./remote-navigation.css">
  <link rel="stylesheet" href="./google-tv.css">
</head>
<body>
  <button class="skip-link" type="button">Pular para o conteúdo</button>
  <aside class="sidebar">
    <div class="logo">CineHub</div>
    <button id="toggle-sidebar" class="chip sidebar-toggle" aria-expanded="true" aria-controls="nav-main" title="Recolher menu"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 6h16M4 12h16M4 18h16"/></svg></button>
    <nav id="nav-main" aria-label="Navegação principal">
      <a href="#/" data-nav="home"><span class="ico" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="m3 10 9-7 9 7v10a1 1 0 0 1-1 1h-6v-7h-4v7H4a1 1 0 0 1-1-1z"/></svg></span><span class="lbl">Início</span></a>
      <a href="#/movies" data-nav="movies"><span class="ico" aria-hidden="true"><svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M8 4v16M16 4v16"/></svg></span><span class="lbl">Filmes</span></a>
      <a href="#/series" data-nav="series"><span class="ico" aria-hidden="true"><svg viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="2"/><path d="M7 7h10M7 12h10M7 17h6"/></svg></span><span class="lbl">Séries</span></a>
      <a href="#/animes" data-nav="animes"><span class="ico" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="m12 2 2.2 6.8L21 11l-6.8 2.2L12 20l-2.2-6.8L3 11l6.8-2.2z"/><path d="m19 14 1.2 2.8L23 18l-2.8 1.2L19 22l-1.2-2.8L15 18l2.8-1.2z"/></svg></span><span class="lbl">Animes</span></a>
      <a href="#/search" data-nav="search"><span class="ico" aria-hidden="true"><svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="m20 20-4-4"/></svg></span><span class="lbl">Pesquisar</span></a>
      <a href="#/library" data-nav="library"><span class="ico" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="m12 3 2.8 5.7 6.2.9-4.5 4.4 1.1 6.2-5.6-3-5.6 3 1.1-6.2L3 9.6l6.2-.9z"/></svg></span><span class="lbl">Biblioteca</span></a>
      <a href="#/settings" data-nav="settings"><span class="ico" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M12 8a4 4 0 1 0 0 8 4 4 0 0 0 0-8z"/><path d="m19.4 15 .1.1 1.4 1.1-1.4 2.4-1.7-.6a8 8 0 0 1-1.5.9l-.3 1.8h-2.8l-.3-1.8a8 8 0 0 1-1.5-.9l-1.7.6-1.4-2.4 1.4-1.1a7 7 0 0 1 0-1.8l-1.4-1.1 1.4-2.4 1.7.6a8 8 0 0 1 1.5-.9l.3-1.8h2.8l.3 1.8a8 8 0 0 1 1.5.9l1.7-.6 1.4 2.4-1.4 1.1a7 7 0 0 1 0 1.8z"/></svg></span><span class="lbl">Configurações</span></a>
      <a href="#/addons" data-nav="addons"><span class="ico" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M12 3v4m0 10v4M3 12h4m10 0h4M5.6 5.6l2.8 2.8m7.2 7.2 2.8 2.8m0-12.8-2.8 2.8m-7.2 7.2-2.8 2.8"/><circle cx="12" cy="12" r="4"/></svg></span><span class="lbl">Addons</span></a>
    </nav>
  </aside>

  <main id="main-content">
    <header class="topbar">
      <form id="top-search-form" role="search"><input id="q" type="search" enterkeyhint="search" placeholder="Pesquisar… (tecla /)" autocomplete="off" aria-label="Pesquisar" aria-keyshortcuts="/"><button id="top-search-submit" type="submit">Pesquisar</button></form>
    </header>
    <section id="view" tabindex="-1"></section>
  </main>

  <div id="offline" class="offline hidden" role="alert">Sem conexão com a internet. Algumas fontes podem não carregar.</div>

  <div id="player" class="hidden" role="dialog" aria-modal="true" aria-label="Reprodutor de vídeo">
    <div class="player-box">
      <button id="close-player" class="close" type="button" title="Fechar (Esc)" aria-label="Fechar player"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m18 6-12 12M6 6l12 12"/></svg></button>
      <div id="player-title" class="player-title" aria-hidden="true"></div>
      <button id="next-ep" class="chip next-ep hidden" type="button"></button>
      <button id="skip-seg" class="chip skip-seg hidden" type="button"></button>
      <button id="pip" class="close pip" type="button" title="Janela flutuante (picture-in-picture)" aria-label="Janela flutuante" hidden><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="3" width="18" height="18" rx="2"/><path d="M13 11h6v6h-6z"/></svg></button>
      <video id="video" class="video-js vjs-big-play-centered" controls preload="metadata" playsinline aria-label="Vídeo em reprodução"></video>
      <div id="native-controls" class="native-controls" hidden aria-label="Controles de reprodução">
        <button id="native-rewind" type="button" aria-label="Voltar 10 segundos" title="Voltar 10 segundos">−10s</button>
        <button id="native-play-pause" type="button" aria-label="Pausar" title="Pausar">Pausar</button>
        <button id="native-forward" type="button" aria-label="Avançar 10 segundos" title="Avançar 10 segundos">+10s</button>
        <span id="native-current-time" class="native-time" aria-live="off">0:00</span>
        <input id="native-seek" class="native-seek" type="range" min="0" max="0" step="0.1" value="0" aria-label="Posição do vídeo">
        <span id="native-duration" class="native-time">0:00</span>
        <button id="native-mute" type="button" aria-label="Silenciar" title="Silenciar">Silenciar</button>
        <input id="native-volume" class="native-volume" type="range" min="0" max="100" step="1" value="100" aria-label="Volume">
        <button id="native-fullscreen" type="button" aria-label="Tela cheia" title="Tela cheia" aria-pressed="false">Tela cheia</button>
      </div>
    </div>
  </div>

  <div id="busy" class="busy hidden" role="status" aria-live="polite"></div>
  <div id="toast" class="toast hidden" role="status" aria-live="polite"></div>

  <dialog id="confirm" aria-labelledby="confirm-msg">
    <form method="dialog" class="dialog-box">
      <p id="confirm-msg"></p>
      <div class="dialog-actions">
        <button value="cancel" class="chip">Cancelar</button>
        <button id="confirm-ok" value="ok" class="danger">Confirmar</button>
      </div>
    </form>
  </dialog>

  <script src="./vendor/video.min.js"></script>
  <script src="./lib.js"></script>
  <script src="./app.js"></script>
  <script src="./torrent-playback.js"></script>
  <script src="./kodi.js"></script>
  <script src="./tv-mode.js"></script>
  <script src="./remote-navigation.js"></script>
  <script src="./accessibility.js"></script>
</body>
</html>
