      <button id="close-player" class="close" type="button" title="Fechar (Esc)" aria-label="Fechar player">✕</button>
      <div id="player-title" class="player-title" aria-hidden="true"></div>
      <button id="next-ep" class="chip next-ep hidden" type="button"></button>
      <video id="video" class="video-js vjs-big-play-centered" controls preload="auto" playsinline></video>
    </div>
  </div>

  <div id="busy" class="busy hidden" role="status" aria-live="polite"></div>
  <div id="toast" class="toast hidden" role="status" aria-live="polite"></div>

  <dialog id="confirm" aria-labelledby="confirm-msg">
    <form method="dialog" class="dialog-box">
      <p id="confirm-msg"></p>
      <div class="dialog-actions">
        <button value="cancel" class="chip">Cancelar</button>
        <button id="confirm-ok" value="ok" class="danger">Confirmar</button>
      </div>
    </form>
  </dialog>

  <script src="./vendor/video.min.js"></script>
  <script src="./lib.js"></script>
  <script src="./app.js"></script>
  <script src="./torrent-playback.js"></script>
  <script src="./kodi.js"></script>
  <script src="./remote-navigation.js"></script>
</body>
</html>
