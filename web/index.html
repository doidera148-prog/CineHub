<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>CineHub</title>
  <!-- Favicon vazio: o app não tem ícone de aba e o navegador não precisa pedir favicon.ico. -->
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="./vendor/video-js.min.css">
  <link rel="stylesheet" href="./style.css">
</head>
<body>
  <aside class="sidebar">
    <div class="logo">CineHub</div>
    <nav>
      <a href="#/" data-nav="home">Início</a>
      <a href="#/movies" data-nav="movies">Filmes</a>
      <a href="#/series" data-nav="series">Séries</a>
      <a href="#/search" data-nav="search">Pesquisar</a>
      <a href="#/library" data-nav="library">Biblioteca</a>
      <a href="#/addons" data-nav="addons">Addons</a>
    </nav>
  </aside>

  <main>
    <header class="topbar">
      <input id="q" type="search" placeholder="Pesquisar filmes e séries…" autocomplete="off" aria-label="Pesquisar">
    </header>
    <section id="view"></section>
  </main>

  <div id="player" class="hidden">
    <div class="player-box">
      <button id="close-player" class="close" title="Fechar (Esc)" aria-label="Fechar player">✕</button>
      <video id="video" class="video-js vjs-big-play-centered" controls preload="auto" playsinline></video>
    </div>
  </div>

  <div id="busy" class="busy hidden" role="status" aria-live="polite"></div>
  <div id="toast" class="toast hidden" role="status" aria-live="polite"></div>

  <dialog id="confirm" aria-labelledby="confirm-msg">
    <form method="dialog" class="dialog-box">
      <p id="confirm-msg"></p>
      <div class="dialog-actions">
        <button value="cancel" class="chip">Cancelar</button>
        <button id="confirm-ok" value="ok" class="danger">Confirmar</button>
      </div>
    </form>
  </dialog>

  <script src="./vendor/video.min.js"></script>
  <script src="./app.js"></script>
  <script src="./torrent-playback.js"></script>
</body>
</html>
