[package]
name = "cinehub-addon"
version = "0.1.0"
edition = "2021"
description = "Addon compatível com o protocolo do Stremio para a sua biblioteca local (pt-BR)"
license = "MIT"

[dependencies]
axum = "0.7"
tokio = { version = "1", features = ["full"] }
serde_json = "1"
tower = { version = "0.4", features = ["util"] }
tower-http = { version = "0.5", features = ["fs", "cors"] }
walkdir = "2"
