name: Teste de instalação (emulador)

# Diagnóstico isolado: instala o APK da última release num emulador Android 10 (x86_64)
# e mostra o erro exato do instalador. Roda só neste branch ou manualmente.
on:
  push:
    branches: [debug/install-test]
  workflow_dispatch:

jobs:
  install:
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    steps:
      - name: Habilitar KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Baixar APKs da última release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release download --repo "${{ github.repository }}" \
            --pattern 'app-x86_64-release.apk' --pattern 'app-arm64-release.apk' --dir apks
          ls -la apks
          for f in apks/*.apk; do echo "$f sha256=$(sha256sum "$f" | cut -c1-16)"; done

      - name: Instalar no emulador Android 10 (x86_64)
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 29
          arch: x86_64
          target: default
          disable-animations: true
          script: |
            adb wait-for-device
            adb shell getprop ro.build.version.release
            adb shell getprop ro.product.cpu.abilist
            echo "== instalando app-x86_64-release.apk"
            adb install -r apks/app-x86_64-release.apk; echo "exit=$?"
            adb shell pm list packages | grep -i cinehub || echo "pacote não instalado"
            adb logcat -d -t 400 | grep -iE "PackageManager|PackageInstaller|INSTALL_|install" | tail -40 || true

      - name: Instalar o APK arm64 (mesmo emulador, para comparar)
        if: always()
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 29
          arch: x86_64
          target: default
          disable-animations: true
          script: |
            adb wait-for-device
            echo "== instalando app-arm64-release.apk"
            adb install -r apks/app-arm64-release.apk; echo "exit=$?"

  install-arm64:
    # O SDK do Android não traz o emulador para Linux ARM64: o arm64 roda por software num runner x86_64.
    runs-on: ubuntu-22.04
    timeout-minutes: 100
    steps:
      - name: Habilitar KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm || true
          ls -la /dev/kvm && echo "KVM disponível" || echo "SEM KVM: emulador rodará por software (lento)"

      - name: Baixar APK arm64 da última release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release download --repo "${{ github.repository }}" --pattern 'app-arm64-release.apk' --dir apks
          ls -la apks

      - name: Instalar no emulador Android 10 arm64
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 29
          arch: arm64-v8a
          target: default
          disable-animations: true
          emulator-boot-timeout: 5400
          script: |
            adb wait-for-device
            adb shell getprop ro.build.version.release
            adb shell getprop ro.product.cpu.abilist
            echo "== instalando app-arm64-release.apk"
            adb install -r apks/app-arm64-release.apk; echo "exit=$?"
            adb shell pm list packages | grep -i cinehub || echo "pacote não instalado"
