# Compila a extensão FFmpeg do Media3 (áudio AC3/E-AC3/DTS/TrueHD/Opus etc. para o ExoPlayer)
# e publica um AAR candidato versionado. O build Android só consome releases aprovados
# explicitamente por tag e SHA-256 no workflow build.yml.
#
# Rodar: Actions → "ffmpeg-extension" → Run workflow (ou alterar as versões abaixo).
# Fontes fixadas por commit: Media3 1.4.1 (mesma do app) e FFmpeg release/6.0.
# O NDK tem de ser o mesmo que o Gradle usa para linkar (AGP 25.1.8937393), e a API nativa igual à do CMake (21).
# Para publicar um candidato, incremente RELEASE_TAG. Depois de publicar, valide o AAR e seu
# SHA-256; só então atualize FFMPEG_RELEASE_TAG e EXPECTED_SHA256 em build.yml. Até lá, o
# Android continua usando o último release aprovado, sem depender de um candidato não verificado.
name: ffmpeg-extension

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  MEDIA3_TAG: "1.4.1"
  MEDIA3_COMMIT: "c35a9d62baec57118ea898e271ac66819399649b"
  FFMPEG_COMMIT: "573f2b81ebd97da81def2ba762e81b0328547004"
  NDK_VERSION: "25.1.8937393"
  CMAKE_VERSION: "3.22.1"
  # Nível da API do build nativo: igual ao alvo do CMake do Media3 (21). Usar outro nível quebra o link.
  NATIVE_API_LEVEL: "21"
  RELEASE_TAG: "ffmpeg-ext-1.4.1-r2"

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 120
    permissions:
      contents: write # para publicar o release com o AAR
    steps:
      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6
        with:
          distribution: temurin
          java-version: "17"
      - name: Android SDK, NDK e CMake
        run: |
          SDKMANAGER=$(ls -d "$ANDROID_HOME"/cmdline-tools/*/bin/sdkmanager | head -1)
          yes | "$SDKMANAGER" --licenses > /dev/null || true
          "$SDKMANAGER" "platform-tools" "platforms;android-34" "build-tools;34.0.0" \
            "ndk;$NDK_VERSION" "cmake;$CMAKE_VERSION"
          echo "NDK_PATH=$ANDROID_HOME/ndk/$NDK_VERSION" >> "$GITHUB_ENV"
      - name: Código do Media3 e do FFmpeg
        run: |
          set -euo pipefail
          git clone --depth 1 --branch "$MEDIA3_TAG" https://github.com/androidx/media "$RUNNER_TEMP/media3"
          actual_media3="$(git -C "$RUNNER_TEMP/media3" rev-parse HEAD)"
          test "$actual_media3" = "$MEDIA3_COMMIT" || {
            echo "::error::O tag Media3 $MEDIA3_TAG não aponta para o commit fixado $MEDIA3_COMMIT (obtido: $actual_media3)."
            exit 1
          }
          git init "$RUNNER_TEMP/ffmpeg"
          git -C "$RUNNER_TEMP/ffmpeg" remote add origin https://github.com/FFmpeg/FFmpeg
          git -C "$RUNNER_TEMP/ffmpeg" fetch --depth 1 origin "$FFMPEG_COMMIT"
          git -C "$RUNNER_TEMP/ffmpeg" checkout --detach FETCH_HEAD
          actual_ffmpeg="$(git -C "$RUNNER_TEMP/ffmpeg" rev-parse HEAD)"
          test "$actual_ffmpeg" = "$FFMPEG_COMMIT" || {
            echo "::error::Checkout FFmpeg não corresponde ao commit fixado."
            exit 1
          }
          ln -s "$RUNNER_TEMP/ffmpeg" "$RUNNER_TEMP/media3/libraries/decoder_ffmpeg/src/main/jni/ffmpeg"
      - name: Compilar o FFmpeg (bibliotecas nativas)
        working-directory: ${{ runner.temp }}/media3/libraries/decoder_ffmpeg/src/main/jni
        run: |
          # Decodificadores de áudio incluídos (só os necessários, para manter o APK menor).
          ./build_ffmpeg.sh \
            "$RUNNER_TEMP/media3/libraries/decoder_ffmpeg/src/main" \
            "$NDK_PATH" "linux-x86_64" "$NATIVE_API_LEVEL" \
            aac ac3 eac3 dca truehd mlp opus vorbis flac alac mp3 \
            pcm_mulaw pcm_alaw amrnb amrwb
      - name: Compilar o AAR
        working-directory: ${{ runner.temp }}/media3
        run: |
          ./gradlew :lib-decoder-ffmpeg:assembleRelease --no-daemon
          AAR=$(find libraries/decoder_ffmpeg -name "*.aar" -path "*release*" | head -1)
          test -n "$AAR"
          cp "$AAR" "$RUNNER_TEMP/media3-decoder-ffmpeg-$MEDIA3_TAG.aar"
          ls -l "$RUNNER_TEMP/media3-decoder-ffmpeg-$MEDIA3_TAG.aar"
      - name: Publicar release com o AAR
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          AAR="$RUNNER_TEMP/media3-decoder-ffmpeg-$MEDIA3_TAG.aar"
          # Aviso de licença junto do binário (a extensão é compilada com FFmpeg em configuração LGPL).
          NOTE="$RUNNER_TEMP/LICENSE-ffmpeg-extension.txt"
          printf '%s\n' \
            "Extensão FFmpeg do AndroidX Media3 $MEDIA3_TAG (Apache-2.0)," \
            "Media3 commit: $MEDIA3_COMMIT.", \
            "FFmpeg commit: $FFMPEG_COMMIT (sem --enable-gpl; LGPL-2.1+).", \
            "Código: https://github.com/androidx/media e https://github.com/FFmpeg/FFmpeg" > "$NOTE"
          gh release view "$RELEASE_TAG" -R "$GITHUB_REPOSITORY" >/dev/null 2>&1 || \
            gh release create "$RELEASE_TAG" -R "$GITHUB_REPOSITORY" --title "Extensão FFmpeg $MEDIA3_TAG" \
              --notes "AAR da extensão FFmpeg do Media3 para o ExoPlayer do CineHub. Fontes fixadas por commit no workflow ffmpeg-extension." \
              --prerelease
          sha256sum "$AAR" > "$AAR.sha256"
          # Não sobrescreve artefatos já publicados: para reconstruir, use um RELEASE_TAG novo.
          gh release upload "$RELEASE_TAG" "$AAR" "$NOTE" "$AAR.sha256" -R "$GITHUB_REPOSITORY"
