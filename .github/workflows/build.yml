name: Build CineHub

on:
  push:
    branches: [main]
    paths-ignore:
      - "**.md"
  pull_request:
  workflow_dispatch:

# Permissão mínima por padrão; só o job de release pode escrever (ver `release`).
permissions:
  contents: read

# Um build por branch: um push novo cancela o build anterior ainda em andamento.
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v4
      - name: Selecionar o espelho Ubuntu mais rápido
        run: |
          sudo bash .github/scripts/select-ubuntu-mirror.sh
          sudo apt-get -o Acquire::Retries=5 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30 update
          sudo apt-get -o Acquire::Retries=5 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30 install -y libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev libayatana-appindicator3-dev
      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          workspaces: src-tauri
      - name: Testes Rust (inclui geometria da sobreposição do player Windows)
        run: cargo test --manifest-path src-tauri/Cargo.toml --all-targets --locked

  lint:
    runs-on: ubuntu-22.04
    permissions:
      contents: read
      checks: write
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v4
      - name: Dependências do Linux
        run: |
          sudo bash .github/scripts/select-ubuntu-mirror.sh
          sudo apt-get -o Acquire::Retries=5 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30 update
          sudo apt-get -o Acquire::Retries=5 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30 install -y libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev libayatana-appindicator3-dev
      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          workspaces: src-tauri
      - name: Formatação Rust (rustfmt)
        run: cargo fmt --manifest-path src-tauri/Cargo.toml --all -- --check
      - name: Formatação YAML e JSON (Prettier)
        run: |
          mapfile -d '' files < <(find .github src-tauri tests -type f \
            \( -name '*.yml' -o -name '*.yaml' -o -name '*.json' \) \
            -not -path '*/target/*' -not -path '*/gen/*' -print0)
          npx --yes prettier@3.6.2 --check "${files[@]}"
      - name: Verificar sintaxe de todos os arquivos JavaScript
        run: |
          find web tests -type f \
            \( -name '*.js' -o -name '*.mjs' \) \
            -not -path 'web/vendor/*' -print0 \
            | xargs -0 -r -n1 node --check
      - name: Detectar variáveis e imports JavaScript não utilizados
        uses: actions/setup-node@v7
        with:
          node-version: "24"
      - name: Executar ESLint 10 para detectar variáveis e imports não utilizados
        run: |
          find web tests -type f \( -name '*.js' -o -name '*.mjs' \) -not -path 'web/vendor/*' -print0 | xargs -0 -r npx --yes eslint@10.15.0 --no-config-lookup --rule 'no-unused-vars:error'
      - name: Validar sintaxe Python
        run: python3 -m compileall -q src-tauri/google-tv tests/python
      - name: Verificar build.yml e executar testes de regressão Python
        run: python3 -m unittest discover -s tests/python -v
      - name: Validar metadados e dependências Rust
        run: cargo metadata --manifest-path src-tauri/Cargo.toml --locked --format-version 1 --no-deps > /dev/null
      - name: Verificar correção da dependência ringbuf vulnerável
        run: |
          if cargo tree --manifest-path src-tauri/Cargo.toml --locked --format '{p}' | grep -Fxq 'ringbuf v0.4.8'; then
            echo "::error::ringbuf 0.4.8 vulnerável ainda está presente na árvore de dependências."
            exit 1
          fi
          cargo tree --manifest-path src-tauri/Cargo.toml --locked -i ringbuf@0.5.3 | grep -q 'librqbit-utp'
      - name: Restaurar cache do cargo-machete
        id: machete-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cargo/bin/cargo-machete
          key: cargo-machete-v0-${{ runner.os }}-${{ runner.arch }}
      - name: Instalar cargo-machete
        if: steps.machete-cache.outputs.cache-hit != 'true'
        run: cargo install cargo-machete --locked
      - name: Salvar cache do cargo-machete
        if: steps.machete-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cargo/bin/cargo-machete
          key: cargo-machete-v0-${{ runner.os }}-${{ runner.arch }}
      - name: Detectar dependências Rust não utilizadas
        run: cargo machete --with-metadata
      # Clippy já compila todos os targets; um cargo check imediatamente antes
      # repetia a mesma compilação sem acrescentar cobertura de lint.
      - name: Clippy (avisos viram erro)
        run: cargo clippy --manifest-path src-tauri/Cargo.toml --all-targets --locked -- -D warnings
      - name: Segurança, avisos, licenças e fontes das dependências (cargo-deny)
        uses: EmbarkStudios/cargo-deny-action@v2
        with:
          manifest-path: src-tauri/Cargo.toml
          command: check advisories bans licenses sources

  web-smoke:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v4
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
      - name: Instalar dependências do teste
        working-directory: tests/web
        run: npm ci
      - name: Verificar árvore de dependências web
        working-directory: tests/web
        run: npm ls --all
      - name: Auditoria de vulnerabilidades das dependências web
        working-directory: tests/web
        run: npm audit --audit-level=high
      - name: Instalar Chromium do Playwright
        working-directory: tests/web
        run: npx playwright install --with-deps chromium
      - name: Teste de fumaça da interface
        working-directory: tests/web
        run: npm test
      - name: Testes de navegação por controle remoto (D-pad)
        working-directory: tests/web
        run: node remote-navigation.test.mjs
      - name: Testes de regressão da pesquisa da interface
        working-directory: tests/web
        run: node search.test.mjs

  desktop:
    strategy:
      fail-fast: false
      matrix:
        platform: [ubuntu-22.04, windows-latest, macos-latest]
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v4
      - name: Dependências do Linux
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo bash .github/scripts/select-ubuntu-mirror.sh
          sudo apt-get -o Acquire::Retries=5 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30 update
          sudo apt-get -o Acquire::Retries=5 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30 install -y libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev libayatana-appindicator3-dev patchelf
      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          workspaces: src-tauri
      - name: Cache do Tauri CLI
        id: tauri-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/bin/cargo-tauri
            ~/.cargo/bin/cargo-tauri.exe
          key: tauri-cli-2.12.5-${{ runner.os }}-${{ runner.arch }}
      - name: Instalar Tauri CLI
        if: steps.tauri-cache.outputs.cache-hit != 'true'
        run: cargo install tauri-cli --version "2.12.5" --locked --force
      - name: Restaurar cache do pacote de desenvolvimento libmpv
        if: matrix.platform == 'windows-latest'
        id: mpv-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/mpv-dev
          key: libmpv-dev-x86_64-20261108-git-55d3feb45c
      - name: Instalar 7-Zip
        if: matrix.platform == 'windows-latest' && steps.mpv-cache.outputs.cache-hit != 'true'
        run: choco install 7zip.install --no-progress -y
      - name: Baixar e extrair libmpv (somente quando não houver cache)
        if: matrix.platform == 'windows-latest' && steps.mpv-cache.outputs.cache-hit != 'true'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $archive = Join-Path $env:RUNNER_TEMP 'mpv-dev.7z'
          $url = 'https://sourceforge.net/projects/mpv-player-windows/files/libmpv/mpv-dev-x86_64-20261108-git-55d3feb45c.7z/download'
          curl.exe --location --fail --retry 3 --output $archive $url
          if ($LASTEXITCODE -ne 0) { throw 'Download do pacote libmpv falhou.' }
          if ((Get-Item $archive).Length -lt 1000000) { throw 'O servidor retornou uma página de erro em vez do pacote libmpv.' }
          $dest = Join-Path $env:RUNNER_TEMP 'mpv-dev'
          & 'C:\Program Files\7-Zip\7z.exe' x $archive "-o$dest" -y
          if ($LASTEXITCODE -ne 0) { throw 'Falha ao extrair o pacote libmpv.' }
          if (-not (Get-ChildItem $dest -Filter 'libmpv-2.dll' -Recurse)) { throw 'libmpv-2.dll não foi encontrado após a extração.' }
      - name: Salvar cache do pacote de desenvolvimento libmpv
        if: matrix.platform == 'windows-latest' && steps.mpv-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/mpv-dev
          key: libmpv-dev-x86_64-20261108-git-55d3feb45c
      - name: Preparar DLLs e variáveis do libmpv
        if: matrix.platform == 'windows-latest'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $dest = Join-Path $env:RUNNER_TEMP 'mpv-dev'
          $dll = Get-ChildItem $dest -Filter 'libmpv-2.dll' -Recurse | Select-Object -First 1
          if (-not $dll) { throw 'libmpv-2.dll não foi encontrado no pacote restaurado.' }
          $resources = Join-Path $env:GITHUB_WORKSPACE 'src-tauri/resources/mpv'
          New-Item -ItemType Directory -Force -Path $resources | Out-Null
          Get-ChildItem $dll.Directory.FullName -Filter '*.dll' | Copy-Item -Destination $resources -Force
          "MPV_LIB_DIR=$($dll.Directory.FullName)" | Out-File -FilePath $env:GITHUB_ENV -Append
          "MPV_DLL=$($dll.FullName)" | Out-File -FilePath $env:GITHUB_ENV -Append
      - name: Criar import library MSVC do libmpv
        if: matrix.platform == 'windows-latest'
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64
      - name: Gerar mpv.lib
        if: matrix.platform == 'windows-latest'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $lines = & dumpbin /nologo /exports $env:MPV_DLL
          if ($LASTEXITCODE -ne 0) { throw 'dumpbin não conseguiu ler os exports do libmpv.' }
          $symbols = foreach ($line in $lines) {
            if ($line -match '^\s+\d+\s+[0-9A-Fa-f]+\s+[0-9A-Fa-f]+\s+(\S+)\s*$') { $Matches[1] }
          }
          if (-not $symbols) { throw 'Nenhum símbolo exportado foi encontrado em libmpv-2.dll.' }
          $def = Join-Path $env:MPV_LIB_DIR 'mpv.def'
          @('LIBRARY libmpv-2.dll', 'EXPORTS') + $symbols | Set-Content -Encoding ascii $def
          $importLib = Join-Path $env:MPV_LIB_DIR 'mpv.lib'
          & lib /nologo "/def:$def" /machine:x64 "/out:$importLib"
          if ($LASTEXITCODE -ne 0 -or -not (Test-Path $importLib)) { throw 'Falha ao gerar mpv.lib.' }
          "LIB=$env:MPV_LIB_DIR;$env:LIB" | Out-File -FilePath $env:GITHUB_ENV -Append
          "PATH=$env:MPV_LIB_DIR;$env:PATH" | Out-File -FilePath $env:GITHUB_ENV -Append
      # ThinLTO mantém otimizações com menor custo de linkedição nos builds desktop.
      - name: Gerar pacotes (macOS/Linux)
        if: matrix.platform != 'windows-latest'
        working-directory: src-tauri
        env:
          CARGO_PROFILE_RELEASE_LTO: thin
          CARGO_PROFILE_RELEASE_CODEGEN_UNITS: "16"
        run: cargo tauri build
      - name: Gerar pacote Windows com player libmpv
        if: matrix.platform == 'windows-latest'
        working-directory: src-tauri
        env:
          CARGO_PROFILE_RELEASE_LTO: thin
          CARGO_PROFILE_RELEASE_CODEGEN_UNITS: "16"
        run: cargo tauri build --config tauri.windows.conf.json --features mpv
      - name: Testar inicialização das opções OSC do libmpv
        if: matrix.platform == 'windows-latest'
        working-directory: src-tauri
        run: cargo test --features mpv --lib mpv_osc_script_options_are_valid
      - name: Verificar se o instalador desktop foi gerado
        shell: bash
        run: |
          case "$RUNNER_OS" in
            Windows) package=$(find src-tauri/target/release/bundle -type f \( -iname '*.msi' -o -iname '*.exe' \) -print -quit) ;;
            macOS) package=$(find src-tauri/target/release/bundle -type f \( -iname '*.dmg' -o -name '*.app' \) -print -quit) ;;
            Linux) package=$(find src-tauri/target/release/bundle -type f \( -iname '*.deb' -o -iname '*.AppImage' \) -print -quit) ;;
            *) echo "Plataforma não reconhecida: $RUNNER_OS"; exit 1 ;;
          esac
          test -n "$package" || { echo "Nenhum instalador foi gerado para $RUNNER_OS"; exit 1; }
          echo "Pacote gerado: $package"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: cinehub-${{ matrix.platform }}
          path: |
            src-tauri/target/release/bundle/**
            !src-tauri/target/release/bundle/**/*.d
      # O gatilho CINEHUB_DEBUG_SIMULATE_D3D11_DEVICE_LOSS só existe com debug_assertions.
      # Gere um instalador de diagnóstico separado; o pacote Release acima não é alterado.
      - name: Gerar pacote Windows Debug para diagnóstico de recuperação D3D11
        if: matrix.platform == 'windows-latest'
        working-directory: src-tauri
        run: cargo tauri build --debug --config tauri.windows.conf.json --features mpv
      - name: Verificar pacote Windows Debug de diagnóstico
        if: matrix.platform == 'windows-latest'
        shell: bash
        run: |
          package=$(find src-tauri/target/debug/bundle -type f \( -iname '*.msi' -o -iname '*.exe' \) -print -quit)
          test -n "$package" || { echo "Nenhum instalador Debug Windows foi gerado"; exit 1; }
          echo "Pacote Debug gerado: $package"
      - name: Publicar artefato Windows Debug de diagnóstico
        if: matrix.platform == 'windows-latest'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: cinehub-windows-d3d11-diagnostic-debug
          path: |
            src-tauri/target/debug/bundle/**
            !src-tauri/target/debug/bundle/**/*.d

  android:
    # Ubuntu 24.04 LTS oferece KVM para acelerar o emulador Google TV x86 (API 34).
    # O APK arm64-v8a continua sendo gerado e verificado separadamente.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v4
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"
      - name: Android SDK e NDK
        run: |
          SDKMANAGER=$(ls -d "$ANDROID_HOME"/cmdline-tools/*/bin/sdkmanager | head -1)
          yes | "$SDKMANAGER" --licenses > /dev/null || true
          "$SDKMANAGER" "platform-tools" "platforms;android-34" "build-tools;34.0.0" "ndk;27.0.12077973" "emulator"
          echo "$ANDROID_HOME/platform-tools" >> "$GITHUB_PATH"
          echo "$ANDROID_HOME/emulator" >> "$GITHUB_PATH"
          test -x "$ANDROID_HOME/platform-tools/adb"
          echo "NDK_HOME=$ANDROID_HOME/ndk/27.0.12077973" >> "$GITHUB_ENV"
      - name: Extensão FFmpeg do Media3 (opcional, do release ffmpeg-ext-1.4.1)
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p src-tauri/plugins/tauri-plugin-exoplayer/android/libs
          gh release download ffmpeg-ext-1.4.1 --pattern 'media3-decoder-ffmpeg-1.4.1.aar' \
            --dir src-tauri/plugins/tauri-plugin-exoplayer/android/libs \
            || echo "Extensão FFmpeg ainda não publicada: o APK sai sem ela."
          # Desempacota o AAR: classes.jar (Java/Kotlin) em libs/ e bibliotecas nativas em jniLibs/.
          EXT=src-tauri/plugins/tauri-plugin-exoplayer/android
          AAR="$EXT/libs/media3-decoder-ffmpeg-1.4.1.aar"
          if [ -f "$AAR" ]; then
            unzip -o -q "$AAR" classes.jar 'jni/*' -d "$RUNNER_TEMP/ffmpeg-aar"
            mv "$RUNNER_TEMP/ffmpeg-aar/classes.jar" "$EXT/libs/media3-decoder-ffmpeg-1.4.1-classes.jar"
            mkdir -p "$EXT/src/main/jniLibs"
            cp -r "$RUNNER_TEMP/ffmpeg-aar/jni/." "$EXT/src/main/jniLibs/"
            ls -R "$EXT/libs" "$EXT/src/main/jniLibs"
          fi
      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,i686-linux-android,x86_64-linux-android
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          workspaces: src-tauri
      - name: Restaurar cache do Tauri CLI
        id: tauri-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/bin/cargo-tauri
            ~/.cargo/bin/cargo-tauri.exe
          key: tauri-cli-2.12.5-${{ runner.os }}-${{ runner.arch }}
      - name: Instalar Tauri CLI
        if: steps.tauri-cache.outputs.cache-hit != 'true'
        run: cargo install tauri-cli --version "2.12.5" --locked
      - name: Salvar cache do Tauri CLI
        if: steps.tauri-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/bin/cargo-tauri
            ~/.cargo/bin/cargo-tauri.exe
          key: tauri-cli-2.12.5-${{ runner.os }}-${{ runner.arch }}
      - name: Restaurar cache do Gradle Android
        id: gradle-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-android-${{ runner.os }}-${{ hashFiles('src-tauri/Cargo.lock', 'src-tauri/tauri.conf.json', 'src-tauri/plugins/**/build.gradle*', 'src-tauri/plugins/**/gradle.properties') }}
          restore-keys: |
            gradle-android-${{ runner.os }}-
      - name: Inicializar projeto Android
        working-directory: src-tauri
        run: cargo tauri android init
      - name: Ajustar manifesto para Google TV
        working-directory: src-tauri
        run: python3 google-tv/patch_manifest.py gen/android/app/src/main/AndroidManifest.xml
      # Manter as opções padrão do perfil release: ThinLTO não demonstrou
      # ganho no build Android e pode aumentar o custo da compilação cruzada.
      - name: Gerar APK
        working-directory: src-tauri
        run: cargo tauri android build --apk --split-per-abi
      - name: Verificar scripts Gradle gerados pelo Tauri
        run: |
          test -f src-tauri/gen/android/tauri.settings.gradle || {
            echo "::error::O build do Tauri não gerou gen/android/tauri.settings.gradle."
            exit 1
          }
      - name: Testes unitários do plugin ExoPlayer
        working-directory: src-tauri/gen/android
        run: ./gradlew testDebugUnitTest
      - name: Salvar cache do Gradle Android
        if: always() && steps.gradle-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-android-${{ runner.os }}-${{ hashFiles('src-tauri/Cargo.lock', 'src-tauri/tauri.conf.json', 'src-tauri/plugins/**/build.gradle*', 'src-tauri/plugins/**/gradle.properties') }}
      - name: Verificar geração dos APKs
        run: |
          set -euo pipefail
          apk_root=src-tauri/gen/android/app/build/outputs/apk
          for abi in arm arm64 x86 x86_64; do
            apk="$apk_root/$abi/release/app-$abi-release-unsigned.apk"
            if [ ! -s "$apk" ]; then
              echo "::error::APK ausente ou vazio para a arquitetura $abi: $apk"
              find "$apk_root" -type f -name '*.apk' -print || true
              exit 1
            fi
            echo "APK gerado para $abi: $apk"
          done
      - name: Assinar APK
        env:
          # Pull requests nunca recebem a chave de release; usam apenas uma chave efêmera para o smoke test.
          KEYSTORE_B64: ${{ github.event_name != 'pull_request' && secrets.ANDROID_KEYSTORE_BASE64 || '' }}
          KEYSTORE_PASS: ${{ github.event_name != 'pull_request' && secrets.ANDROID_KEYSTORE_PASSWORD || '' }}
          KEY_ALIAS: ${{ github.event_name != 'pull_request' && secrets.ANDROID_KEY_ALIAS || '' }}
          KEY_PASS: ${{ github.event_name != 'pull_request' && secrets.ANDROID_KEY_PASSWORD || '' }}
        run: |
          set -euo pipefail
          BT="$ANDROID_HOME/build-tools/34.0.0"
          if [ "$GITHUB_EVENT_NAME" = "pull_request" ]; then
            # PRs usam uma chave descartável para validar a instalação no emulador.
            keytool -genkeypair -keystore release.jks -storepass android -keypass android \
              -alias cinehub -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=CineHub PR"
            KS=release.jks; PASS=android; ALIAS=cinehub; KPASS=android
          else
            # Builds publicáveis nunca podem recorrer silenciosamente a uma assinatura temporária.
            for secret in KEYSTORE_B64 KEYSTORE_PASS KEY_ALIAS KEY_PASS; do
              if [ -z "${!secret}" ]; then
                echo "::error::Secret obrigatório ausente ou vazio: $secret"
                exit 1
              fi
            done
            if ! printf '%s' "$KEYSTORE_B64" | base64 -d > release.p12; then
              echo "::error::ANDROID_KEYSTORE_BASE64 não contém um keystore Base64 válido."
              exit 1
            fi
            if [ ! -s release.p12 ]; then
              echo "::error::O keystore decodificado está vazio."
              exit 1
            fi
            if ! keytool -list -keystore release.p12 -storetype PKCS12 -storepass "$KEYSTORE_PASS" -alias "$KEY_ALIAS" > /dev/null; then
              echo "::error::Não foi possível validar o keystore, a senha ou o alias configurado."
              exit 1
            fi
            KS=release.p12; PASS="$KEYSTORE_PASS"; ALIAS="$KEY_ALIAS"; KPASS="$KEY_PASS"
          fi
          mkdir -p signed
          find src-tauri/gen/android/app/build/outputs/apk -name "*-unsigned.apk" | while read -r apk; do
            out="signed/$(basename "${apk/-unsigned/}")"
            "$BT/zipalign" -f -p 4 "$apk" aligned.apk
            "$BT/apksigner" sign --ks "$KS" --ks-pass "pass:$PASS" --ks-key-alias "$ALIAS" \
              --key-pass "pass:$KPASS" --out "$out" aligned.apk
            "$BT/apksigner" verify --verbose "$out"
          done
          ls -la signed
      - name: Verificar APK Google TV ARM64
        run: |
          set -euo pipefail
          arm64_apk=$(for candidate in signed/*.apk; do
            [ -f "$candidate" ] || continue
            if unzip -Z1 "$candidate" | grep -q '^lib/arm64-v8a/'; then echo "$candidate"; break; fi
          done)
          test -n "$arm64_apk" || { echo "APK com bibliotecas nativas arm64-v8a não foi gerado"; exit 1; }
          echo "APK ARM64 gerado e validado: $arm64_apk"
      - name: Habilitar aceleração KVM no Ubuntu
        run: |
          set -euo pipefail
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          test -e /dev/kvm
          ls -l /dev/kvm
      - name: Instalar e iniciar CineHub em emulador Google TV
        timeout-minutes: 20
        run: |
          set -euo pipefail
          "$ANDROID_HOME/emulator/emulator" -accel-check
          SDKMANAGER=$(ls -d "$ANDROID_HOME"/cmdline-tools/*/bin/sdkmanager | head -1)
          SDKTOOLS=$(dirname "$SDKMANAGER")
          yes | "$SDKMANAGER" --licenses > /dev/null || true
          "$SDKMANAGER" "system-images;android-34;google-tv;x86"
          export ANDROID_AVD_HOME="$HOME/.android/avd"
          mkdir -p "$ANDROID_AVD_HOME"
          printf 'no\\n' | "$SDKTOOLS/avdmanager" create avd --name cinehub-google-tv-x86 --package "system-images;android-34;google-tv;x86" --device tv_1080p --path "$ANDROID_AVD_HOME/cinehub-google-tv-x86.avd" --force
          test -s "$ANDROID_AVD_HOME/cinehub-google-tv-x86.ini"
          test -f "$ANDROID_AVD_HOME/cinehub-google-tv-x86.avd/config.ini"
          command -v adb
          # O runner é efêmero: reinicia o servidor ADB e desativa a autorização
          # por chave RSA do emulador para evitar o estado "device unauthorized".
          adb kill-server || true
          adb start-server
          EMULATOR_LOG="$RUNNER_TEMP/google-tv-emulator.log"
          "$ANDROID_HOME/emulator/emulator" -avd cinehub-google-tv-x86 -no-window -no-audio -no-boot-anim -no-snapshot -no-snapshot-save -skip-adb-auth -accel on -gpu swiftshader_indirect >"$EMULATOR_LOG" 2>&1 &
          for attempt in $(seq 1 60); do
            if adb devices | grep -qE '^emulator-[0-9]+[[:space:]]+device$'; then
              break
            fi
            sleep 5
          done
          if ! adb devices | grep -qE '^emulator-[0-9]+[[:space:]]+device$'; then
            echo "::error::O emulador Google TV não ficou disponível no ADB em 5 minutos."
            adb devices || true
            tail -n 200 "$EMULATOR_LOG" || true
            exit 1
          fi
          for attempt in $(seq 1 96); do
            booted=$(adb shell getprop sys.boot_completed 2>/dev/null | tr -d '\r' || true)
            [ "$booted" = "1" ] && break
            sleep 5
          done
          if [ "$(adb shell getprop sys.boot_completed 2>/dev/null | tr -d '\r' || true)" != "1" ]; then
            echo "::error::Emulador Google TV x86 conectou ao ADB, mas não concluiu a inicialização em 8 minutos."
            adb devices || true
            adb logcat -d -t 300 || true
            tail -n 200 "$EMULATOR_LOG" || true
            exit 1
          fi
          apk=$(for candidate in signed/*.apk; do
            [ -f "$candidate" ] || continue
            if unzip -Z1 "$candidate" | grep -q '^lib/x86/'; then echo "$candidate"; break; fi
          done)
          test -n "$apk" || { echo "APK com bibliotecas nativas x86 para o teste no emulador não foi gerado"; exit 1; }
          adb install -r "$apk"
          adb logcat -c
          # Em Google TV, iniciar pela categoria Leanback evita depender do launcher de celular.
          adb shell monkey -p com.cinehub.app -c android.intent.category.LEANBACK_LAUNCHER -v 1
          # Verifica a sobrevivência do processo após a abertura e cada tecla.
          # Se houver encerramento, coleta motivo de saída, atividade em primeiro plano,
          # processos e logcat completo antes de falhar o job.
          diagnose_app_exit() {
            local stage="$1"
            echo "::error::CineHub não permaneceu ativo: $stage."
            echo "===== Estado do ADB ====="
            adb devices -l || true
            echo "===== Processos CineHub ====="
            adb shell ps -A | grep -i 'cinehub\|com.cinehub.app' || true
            echo "===== Atividade em primeiro plano ====="
            adb shell dumpsys activity activities | grep -E 'mResumedActivity|topResumedActivity|Resumed:' || true
            echo "===== Motivos de encerramento registrados pelo Android ====="
            adb shell dumpsys activity exit-info com.cinehub.app || true
            echo "===== Exceções Android ====="
            adb logcat -d -b all -v threadtime -t 1200 | grep -i -E 'FATAL EXCEPTION|AndroidRuntime|am_crash|am_kill|Force finishing|Killing .*com.cinehub.app|Process .*com.cinehub.app|libc.*(fatal|signal)|tombstone' | tail -n 250 || true
            echo "===== Últimas linhas do logcat ====="
            adb logcat -d -b all -v threadtime -t 500 | tail -n 500 || true
            exit 1
          }
          transient_recovery_attempted=0
          check_app_alive() {
            local stage="$1"
            local app_pid
            app_pid=$(adb shell pidof com.cinehub.app 2>/dev/null | tr -d '\r' || true)
            if [ -z "$app_pid" ]; then
              local exit_info
              exit_info=$(adb shell dumpsys activity exit-info com.cinehub.app 2>/dev/null || true)
              # Google TV images can transiently kill dependent apps when the GMS
              # persistent process/provider restarts during first-boot provisioning.
              # Recover only this explicit platform exit reason, once; all app crashes
              # and other exit reasons remain hard failures.
              if [ "$transient_recovery_attempted" -eq 0 ] \
                && grep -Fq 'reason=12 (DEPENDENCY DIED)' <<< "$exit_info" \
                && grep -Fq 'com.google.android.gms/.fonts.provider.FontsProvider' <<< "$exit_info" \
                && grep -Fq 'com.google.android.gms.persistent' <<< "$exit_info"; then
                transient_recovery_attempted=1
                echo "::warning::Android encerrou o CineHub porque o processo do provedor FontsProvider do Google Play Services morreu. Aguardando estabilização e repetindo a inicialização uma única vez."
                sleep 15
                adb shell monkey -p com.cinehub.app -c android.intent.category.LEANBACK_LAUNCHER -v 1
                sleep 20
                app_pid=$(adb shell pidof com.cinehub.app 2>/dev/null | tr -d '\r' || true)
              fi
              if [ -z "$app_pid" ]; then
                diagnose_app_exit "$stage"
              fi
            fi
            echo "CineHub ativo ($stage), PID: $app_pid"
          }
          sleep 20
          check_app_alive "após a inicialização"
          for key in 19 20 21 22 23; do
            echo "Enviando tecla D-pad Android keycode=$key"
            adb shell input keyevent "$key"
            sleep 2
            check_app_alive "após D-pad keycode=$key"
          done
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: cinehub-android-phone-tv
          path: signed/*.apk

  release:
    # Só publica quando testes, lint e teste de fumaça da interface passaram.
    if: ${{ always() && github.event_name != 'pull_request' && needs.test.result == 'success' && needs.lint.result == 'success' && needs.web-smoke.result == 'success' && needs.desktop.result == 'success' && needs.android.result == 'success' }}
    needs: [test, lint, web-smoke, desktop, android]
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: artifacts
      - name: Listar arquivos
        run: find artifacts -type f | sort
      - name: Publicar binários no GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: CineHub build ${{ github.run_number }}
          body: |
            Build automático do commit `${{ github.sha }}`.
            Instaladores: Windows (.msi/.exe), macOS (.dmg), Linux (.deb/.AppImage) e Android (.apk, celular e Google TV).
          files: |
            artifacts/**/*.msi
            artifacts/**/*.exe
            artifacts/**/*.dmg
            artifacts/**/*.deb
            artifacts/**/*.AppImage
            artifacts/**/*.apk
          fail_on_unmatched_files: false
      - name: Limpar releases antigas (manter as 10 mais recentes)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release list --repo "${{ github.repository }}" --limit 200 --json tagName -q '.[].tagName' \
            | grep '^build-' | tail -n +11 \
            | while read -r tag; do gh release delete "$tag" --repo "${{ github.repository }}" --yes --cleanup-tag; done
