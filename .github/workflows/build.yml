name: Build CineHub

on:
  push:
    branches: [main]
    paths-ignore:
      - "**.md"
  pull_request:
  workflow_dispatch:

# Permissão mínima por padrão; só o job de release pode escrever (ver `release`).
permissions:
  contents: read

# Um build por branch: um push novo cancela o build anterior ainda em andamento.
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev libayatana-appindicator3-dev
      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          workspaces: src-tauri
      - run: cargo test --manifest-path src-tauri/Cargo.toml

  lint:
    runs-on: ubuntu-22.04
    permissions:
      contents: read
      checks: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Dependências do Linux
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev libayatana-appindicator3-dev
      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          workspaces: src-tauri
      - name: Formatação
        run: cargo fmt --manifest-path src-tauri/Cargo.toml --all -- --check
      - name: Clippy (avisos viram erro)
        run: cargo clippy --manifest-path src-tauri/Cargo.toml --all-targets -- -D warnings
      - name: Licenças e fontes das dependências (cargo-deny)
        uses: EmbarkStudios/cargo-deny-action@v2
        continue-on-error: true
        with:
          manifest-path: src-tauri/Cargo.toml
          command: check licenses sources
      - name: Sintaxe do JavaScript
        run: node --check web/app.js && node --check tests/web/smoke.mjs
      - name: Auditoria de dependências
        uses: rustsec/audit-check@v2
        continue-on-error: true
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          working-directory: src-tauri

  web-smoke:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@v7
        with:
          node-version: "20"
      - name: Instalar dependências do teste
        working-directory: tests/web
        run: npm ci
      - name: Instalar Chromium do Playwright
        working-directory: tests/web
        run: npx playwright install --with-deps chromium
      - name: Teste de fumaça da interface
        working-directory: tests/web
        run: npm test

  desktop:
    strategy:
      fail-fast: false
      matrix:
        platform: [ubuntu-22.04, windows-latest, macos-latest]
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Dependências do Linux
        if: matrix.platform == 'ubuntu-22.04'
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev libayatana-appindicator3-dev patchelf
      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          workspaces: src-tauri
      - name: Cache do Tauri CLI
        id: tauri-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/bin/cargo-tauri
            ~/.cargo/bin/cargo-tauri.exe
          key: tauri-cli-2-${{ runner.os }}-${{ hashFiles('.github/workflows/build.yml') }}
      - name: Instalar Tauri CLI
        if: steps.tauri-cache.outputs.cache-hit != 'true'
        run: cargo install tauri-cli --version "^2" --locked --force
      - name: Instalar 7-Zip
        if: matrix.platform == 'windows-latest'
        run: choco install 7zip.install --no-progress -y
      - name: Preparar libmpv para o player MKV do Windows
        if: matrix.platform == 'windows-latest'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $archive = Join-Path $env:RUNNER_TEMP 'mpv-dev.7z'
          $url = 'https://sourceforge.net/projects/mpv-player-windows/files/libmpv/mpv-dev-x86_64-20261108-git-55d3feb45c.7z/download'
          curl.exe --location --fail --retry 3 --output $archive $url
          if ($LASTEXITCODE -ne 0) { throw 'Download do pacote libmpv falhou.' }
          if ((Get-Item $archive).Length -lt 1000000) { throw 'O servidor retornou uma página de erro em vez do pacote libmpv.' }
          $dest = Join-Path $env:RUNNER_TEMP 'mpv-dev'
          & 'C:\Program Files\7-Zip\7z.exe' x $archive "-o$dest" -y
          if ($LASTEXITCODE -ne 0) { throw 'Falha ao extrair o pacote libmpv.' }
          $dll = Get-ChildItem $dest -Filter 'libmpv-2.dll' -Recurse | Select-Object -First 1
          if (-not $dll) { throw 'libmpv-2.dll não foi encontrado.' }
          $resources = Join-Path $env:GITHUB_WORKSPACE 'src-tauri/resources/mpv'
          New-Item -ItemType Directory -Force -Path $resources | Out-Null
          Get-ChildItem $dll.Directory.FullName -Filter '*.dll' | Copy-Item -Destination $resources -Force
          "MPV_LIB_DIR=$($dll.Directory.FullName)" | Out-File -FilePath $env:GITHUB_ENV -Append
          "MPV_DLL=$($dll.FullName)" | Out-File -FilePath $env:GITHUB_ENV -Append
      - name: Criar import library MSVC do libmpv
        if: matrix.platform == 'windows-latest'
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64
      - name: Gerar mpv.lib
        if: matrix.platform == 'windows-latest'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $lines = & dumpbin /nologo /exports $env:MPV_DLL
          if ($LASTEXITCODE -ne 0) { throw 'dumpbin não conseguiu ler os exports do libmpv.' }
          $symbols = foreach ($line in $lines) {
            if ($line -match '^\s+\d+\s+[0-9A-Fa-f]+\s+[0-9A-Fa-f]+\s+(\S+)\s*$'
