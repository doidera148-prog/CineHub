name: Build CineHub

on:
  push:
    branches: [main]
    paths-ignore:
      - "**.md"
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev libayatana-appindicator3-dev
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: cargo test --manifest-path src-tauri/Cargo.toml

  lint:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Dependências do Linux
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev libayatana-appindicator3-dev
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - name: Formatação
        run: cargo fmt --manifest-path src-tauri/Cargo.toml --all -- --check
      - name: Clippy (avisos viram erro)
        run: cargo clippy --manifest-path src-tauri/Cargo.toml --all-targets -- -D warnings
      - name: Auditoria de dependências
        uses: rustsec/audit-check@v2
        continue-on-error: true
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

  desktop:
    strategy:
      fail-fast: false
      matrix:
        platform: [ubuntu-22.04, windows-latest, macos-latest]
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4
      - name: Dependências do Linux
        if: matrix.platform == 'ubuntu-22.04'
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev libayatana-appindicator3-dev patchelf
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - name: Cache do Tauri CLI
        id: tauri-cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/cargo-tauri
            ~/.cargo/bin/cargo-tauri.exe
          key: tauri-cli-2-${{ runner.os }}-${{ hashFiles('.github/workflows/build.yml') }}
      - name: Instalar Tauri CLI
        if: steps.tauri-cache.outputs.cache-hit != 'true'
        run: cargo install tauri-cli --version "^2" --locked
      - name: Gerar pacotes
        working-directory: src-tauri
        run: cargo tauri build
      - uses: actions/upload-artifact@v4
        with:
          name: cinehub-${{ matrix.platform }}
          path: |
            src-tauri/target/release/bundle/**
            !src-tauri/target/release/bundle/**/*.d

  android:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Android SDK e NDK
        run: |
          SDKMANAGER=$(ls -d "$ANDROID_HOME"/cmdline-tools/*/bin/sdkmanager | head -1)
          yes | "$SDKMANAGER" --licenses > /dev/null || true
          "$SDKMANAGER" "platform-tools" "platforms;android-34" "build-tools;34.0.0" "ndk;27.0.12077973"
          echo "NDK_HOME=$ANDROID_HOME/ndk/27.0.12077973" >> "$GITHUB_ENV"
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,i686-linux-android,x86_64-linux-android
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - name: Cache do Tauri CLI
        id: tauri-cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/cargo-tauri
            ~/.cargo/bin/cargo-tauri.exe
          key: tauri-cli-2-${{ runner.os }}-${{ hashFiles('.github/workflows/build.yml') }}
      - name: Instalar Tauri CLI
        if: steps.tauri-cache.outputs.cache-hit != 'true'
        run: cargo install tauri-cli --version "^2" --locked
      - name: Inicializar projeto Android
        working-directory: src-tauri
        run: cargo tauri android init
      - name: Ajustar manifesto para Android TV
        working-directory: src-tauri
        run: python3 android-tv/patch_manifest.py gen/android/app/src/main/AndroidManifest.xml
      - name: Gerar APK
        working-directory: src-tauri
        run: cargo tauri android build --apk --target aarch64 --target armv7 --target i686 --target x86_64
      - uses: actions/upload-artifact@v4
        with:
          name: cinehub-android-phone-tv
          path: src-tauri/gen/android/app/build/outputs/apk/**/*.apk

  release:
    if: ${{ always() && github.event_name != 'pull_request' && needs.test.result == 'success' && (needs.desktop.result == 'success' || needs.android.result == 'success') }}
    needs: [test, lint, desktop, android]
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Listar arquivos
        run: find artifacts -type f | sort
      - name: Publicar binários no GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: CineHub build ${{ github.run_number }}
          body: |
            Build automático do commit `${{ github.sha }}`.
            Instaladores: Windows (.msi/.exe), macOS (.dmg), Linux (.deb/.AppImage) e Android (.apk, celular e Android TV).
          files: |
            artifacts/**/*.msi
            artifacts/**/*.exe
            artifacts/**/*.dmg
            artifacts/**/*.deb
            artifacts/**/*.AppImage
            artifacts/**/*.apk
          fail_on_unmatched_files: false
      - name: Limpar releases antigas (manter as 10 mais recentes)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release list --repo "${{ github.repository }}" --limit 200 --json tagName -q '.[].tagName' \
            | grep '^build-' | tail -n +11 \
            | while read -r tag; do gh release delete "$tag" --repo "${{ github.repository }}" --yes --cleanup-tag; done
