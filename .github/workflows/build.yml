name: Build CineHub

on:
  push:
    branches: [main]
    paths-ignore:
      - "**.md"
  pull_request:
  workflow_dispatch:

# Permissão mínima por padrão; só o job de release pode escrever (ver `release`).
permissions:
  contents: read

# Um build por branch: um push novo cancela o build anterior ainda em andamento.
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev libayatana-appindicator3-dev
      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          workspaces: src-tauri
      - run: cargo test --manifest-path src-tauri/Cargo.toml

  lint:
    runs-on: ubuntu-22.04
    permissions:
      contents: read
      checks: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Dependências do Linux
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev libayatana-appindicator3-dev
      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          workspaces: src-tauri
      - name: Formatação
        run: cargo fmt --manifest-path src-tauri/Cargo.toml --all -- --check
      - name: Clippy (avisos viram erro)
        run: cargo clippy --manifest-path src-tauri/Cargo.toml --all-targets -- -D warnings
      - name: Licenças e fontes das dependências (cargo-deny)
        uses: EmbarkStudios/cargo-deny-action@v2
        continue-on-error: true
        with:
          manifest-path: src-tauri/Cargo.toml
          command: check licenses sources
      - name: Sintaxe do JavaScript
        run: node --check web/app.js && node --check tests/web/smoke.mjs
      - name: Auditoria de dependências
        uses: rustsec/audit-check@v2
        continue-on-error: true
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          working-directory: src-tauri

  web-smoke:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Instalar dependências do teste
        working-directory: tests/web
        run: npm ci
      - name: Instalar Chromium do Playwright
        working-directory: tests/web
        run: npx playwright install --with-deps chromium
      - name: Teste de fumaça da interface
        working-directory: tests/web
        run: npm test

  desktop:
    strategy:
      fail-fast: false
      matrix:
        platform: [ubuntu-22.04, windows-latest, macos-latest]
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Dependências do Linux
        if: matrix.platform == 'ubuntu-22.04'
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev libayatana-appindicator3-dev patchelf
      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          workspaces: src-tauri
      - name: Cache do Tauri CLI
        id: tauri-cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ~/.cargo/bin/cargo-tauri
            ~/.cargo/bin/cargo-tauri.exe
          key: tauri-cli-2-${{ runner.os }}-${{ hashFiles('.github/workflows/build.yml') }}
      - name: Instalar Tauri CLI
        if: steps.tauri-cache.outputs.cache-hit != 'true'
        run: cargo install tauri-cli --version "^2" --locked
      - name: Preparar libmpv (Windows, player nativo)
        if: matrix.platform == 'windows-latest'
        working-directory: src-tauri
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: ../.github/scripts/prepare-libmpv.ps1
      # O código do mpv (feature `mpv`) só é compilado aqui; o lint do Linux não o analisa.
      - name: Clippy com o player nativo (Windows)
        if: matrix.platform == 'windows-latest'
        working-directory: src-tauri
        run: cargo clippy --all-targets --features mpv -- -D warnings
      - name: Gerar pacotes
        working-directory: src-tauri
        run: cargo tauri build ${{ matrix.platform == 'windows-latest' && '--features mpv' || '' }}
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: cinehub-${{ matrix.platform }}
          path: |
            src-tauri/target/release/bundle/**
            !src-tauri/target/release/bundle/**/*.d

  android:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"
      - name: Android SDK e NDK
        run: |
          SDKMANAGER=$(ls -d "$ANDROID_HOME"/cmdline-tools/*/bin/sdkmanager | head -1)
          yes | "$SDKMANAGER" --licenses > /dev/null || true
          "$SDKMANAGER" "platform-tools" "platforms;android-34" "build-tools;34.0.0" "ndk;27.0.12077973"
          echo "NDK_HOME=$ANDROID_HOME/ndk/27.0.12077973" >> "$GITHUB_ENV"
      - name: Extensão FFmpeg do Media3 (opcional, do release ffmpeg-ext-1.4.1)
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p src-tauri/plugins/tauri-plugin-exoplayer/android/libs
          gh release download ffmpeg-ext-1.4.1 --pattern 'media3-decoder-ffmpeg-1.4.1.aar' \
            --dir src-tauri/plugins/tauri-plugin-exoplayer/android/libs \
            || echo "Extensão FFmpeg ainda não publicada: o APK sai sem ela."
          ls src-tauri/plugins/tauri-plugin-exoplayer/android/libs
      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,i686-linux-android,x86_64-linux-android
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          workspaces: src-tauri
      - name: Cache do Tauri CLI
        id: tauri-cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ~/.cargo/bin/cargo-tauri
            ~/.cargo/bin/cargo-tauri.exe
          key: tauri-cli-2-${{ runner.os }}-${{ hashFiles('.github/workflows/build.yml') }}
      - name: Instalar Tauri CLI
        if: steps.tauri-cache.outputs.cache-hit != 'true'
        run: cargo install tauri-cli --version "^2" --locked
      - name: Inicializar projeto Android
        working-directory: src-tauri
        run: cargo tauri android init
      - name: Ajustar manifesto para Android TV
        working-directory: src-tauri
        run: python3 android-tv/patch_manifest.py gen/android/app/src/main/AndroidManifest.xml
      - name: Gerar APK
        working-directory: src-tauri
        run: cargo tauri android build --apk --split-per-abi
      - name: Assinar APK
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASS: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          BT="$ANDROID_HOME/build-tools/34.0.0"
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > release.jks
            KS=release.jks; PASS="$KEYSTORE_PASS"; ALIAS="$KEY_ALIAS"; KPASS="$KEY_PASS"
          else
            # Sem segredos configurados: chave temporária do build. Instala, mas cada build
            # tem assinatura diferente, então é preciso desinstalar a versão anterior.
            echo "::warning::Segredos ANDROID_KEYSTORE_* não configurados; APK assinado com chave temporária."
            keytool -genkeypair -keystore release.jks -storepass android -keypass android \
              -alias cinehub -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=CineHub"
            KS=release.jks; PASS=android; ALIAS=cinehub; KPASS=android
          fi
          mkdir -p signed
          find src-tauri/gen/android/app/build/outputs/apk -name "*-unsigned.apk" | while read -r apk; do
            out="signed/$(basename "${apk/-unsigned/}")"
            "$BT/zipalign" -f -p 4 "$apk" aligned.apk
            "$BT/apksigner" sign --ks "$KS" --ks-pass "pass:$PASS" --ks-key-alias "$ALIAS" \
              --key-pass "pass:$KPASS" --out "$out" aligned.apk
            "$BT/apksigner" verify --verbose "$out"
          done
          ls -la signed
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: cinehub-android-phone-tv
          path: signed/*.apk

  release:
    # Só publica quando testes, lint e teste de fumaça da interface passaram.
    if: ${{ always() && github.event_name != 'pull_request' && needs.test.result == 'success' && needs.lint.result == 'success' && needs.web-smoke.result == 'success' && (needs.desktop.result == 'success' || needs.android.result == 'success') }}
    needs: [test, lint, web-smoke, desktop, android]
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Listar arquivos
        run: find artifacts -type f | sort
      - name: Publicar binários no GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: CineHub build ${{ github.run_number }}
          body: |
            Build automático do commit `${{ github.sha }}`.
            Instaladores: Windows (.msi/.exe), macOS (.dmg), Linux (.deb/.AppImage) e Android (.apk, celular e Android TV).
          files: |
            artifacts/**/*.msi
            artifacts/**/*.exe
            artifacts/**/*.dmg
            artifacts/**/*.deb
            artifacts/**/*.AppImage
            artifacts/**/*.apk
          fail_on_unmatched_files: false
      - name: Limpar releases antigas (manter as 10 mais recentes)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release list --repo "${{ github.repository }}" --limit 200 --json tagName -q '.[].tagName' \
            | grep '^build-' | tail -n +11 \
            | while read -r tag; do gh release delete "$tag" --repo "${{ github.repository }}" --yes --cleanup-tag; done
