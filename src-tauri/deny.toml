# cargo-deny: licenças, avisos de segurança e fontes das dependências.
# Usado no CI como verificação obrigatória. Rode localmente com:
#   cargo deny --manifest-path src-tauri/Cargo.toml check

[advisories]
version = 2
yanked = "warn"

[licenses]
version = 2
confidence-threshold = 0.8
allow = [
  "MIT",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "ISC",
  "Unicode-3.0",
  "Zlib",
  "MPL-2.0",
  "GPL-3.0-or-later",
  "LGPL-2.1",
  "CDLA-Permissive-2.0",
  "BSL-1.0",
  "CC0-1.0",
]

[bans]
multiple-versions = "warn"
wildcards = "allow"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
