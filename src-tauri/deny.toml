# cargo-deny: licenças, avisos de segurança e fontes das dependências.
# Usado no CI como verificação obrigatória. Rode localmente com:
#   cargo deny --manifest-path src-tauri/Cargo.toml check

[advisories]
version = 2
yanked = "warn"
ignore = [
  # Dependência de build do GTK 0.18, transitiva do Tauri no Linux; não integra o app final.
  # Remover quando o ecossistema GTK/Tauri substituir proc-macro-error.
  { id = "RUSTSEC-2024-0370", reason = "somente build-time via GTK/Tauri no Linux; acompanhar atualização do upstream" },
  # zvariant foi incorporado ao zbus 6; Tauri opener ainda usa zbus 5.x e não há upgrade seguro isolado.
  { id = "RUSTSEC-2026-0370", reason = "transitivo de tauri-plugin-opener/zbus 5; remover quando Tauri migrar para zbus 6" },
  { id = "RUSTSEC-2026-0371", reason = "transitivo de tauri-plugin-opener/zbus 5; remover quando Tauri migrar para zbus 6" },
  { id = "RUSTSEC-2026-0372", reason = "transitivo de tauri-plugin-opener/zbus 5; remover quando Tauri migrar para zbus 6" },
  # chrono é usado por librqbit-dht; o advisory afeta todas as versões e recomenda migração upstream.
  { id = "RUSTSEC-2026-0543", reason = "transitivo de librqbit-dht 9.1.0; todas as versões chrono afetadas, aguardar migração upstream para time/jiff" },
]

[licenses]
version = 2
confidence-threshold = 0.8
allow = [
  "MIT",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "ISC",
  "Unicode-3.0",
  "Zlib",
  "MPL-2.0",
  "GPL-3.0-or-later",
  "LGPL-2.1",
  "CDLA-Permissive-2.0",
  "BSL-1.0",
  "CC0-1.0",
]

[bans]
multiple-versions = "warn"
wildcards = "allow"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
