[package]
name = "tauri-plugin-exoplayer"
version = "0.1.0"
description = "Player nativo (ExoPlayer/Media3) para o CineHub no Android."
edition = "2021"
license = "MIT"
links = "tauri-plugin-exoplayer"

[dependencies]
tauri = { version = "2", features = [] }

[build-dependencies]
tauri-plugin = { version = "2", features = ["build"] }

[package.metadata.cargo-machete]
# Crate usado exclusivamente pelo build.rs do plugin.
ignored = ["tauri-plugin"]
