[package]
name = "cinehub"
version = "0.2.0"
description = "CineHub: aplicativo de streaming compatível com os addons do Stremio (pt-BR)"
authors = ["CineHub"]
license = "MIT"
edition = "2021"

[lib]
name = "cinehub_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "cinehub"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["sync"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
futures = "0.3"
