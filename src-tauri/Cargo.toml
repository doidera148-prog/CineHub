[package]
name = "cinehub"
version = "0.2.0"
description = "CineHub: aplicativo de streaming compatível com os addons do Stremio (pt-BR)"
authors = ["CineHub"]
license = "MIT"
edition = "2021"

[lib]
name = "cinehub_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "cinehub"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["sync", "time", "fs", "net", "io-util", "rt-multi-thread", "macros"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
futures = "0.3"
axum = "0.8"
librqbit = { version = "9.1.0", default-features = false, features = ["rust-tls"] }
tokio-util = { version = "0.7", features = ["io"] }
uuid = { version = "1", features = ["v4"] }
urlencoding = "2"

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "io-util", "sync"] }

[profile.release]
# Binários menores (importante no APK de celulares).
lto = true
codegen-units = 1
strip = "symbols"
opt-level = "s"
